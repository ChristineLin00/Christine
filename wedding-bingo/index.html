<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>歡樂婚禮 Bingo｜Su & Lin's Wedding</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff758c;--pink2:#ff7eb3;--bg:#fff0f5;--line:#ffe4e1;--yellow:#ffd166;--orange:#d35400;--orange2:#f39c12;--ink:#7a3e50}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"Noto Sans TC",sans-serif;color:var(--ink);background-color:var(--bg);background-image:radial-gradient(#ffd1dc 1.5px,transparent 1.5px);background-size:30px 30px}
button{font:inherit;cursor:pointer;border:0}.wrap{width:min(1180px,94vw);margin:0 auto;padding:28px 0 36px}
.hero{display:flex;gap:24px;align-items:center;background:rgba(255,255,255,.94);border-radius:28px;padding:20px 26px;box-shadow:0 12px 30px rgba(190,80,110,.13);margin-bottom:22px}
.photo{width:190px;height:145px;flex:0 0 190px;border:8px solid #fff;background:#ffe3eb;box-shadow:0 8px 16px rgba(120,40,70,.18);transform:rotate(-3deg);display:flex;align-items:center;justify-content:center;overflow:hidden;color:#c46b83;font-weight:700;text-align:center}
.photo img{width:100%;height:100%;object-fit:cover}.photo small{padding:12px}.eyebrow{font-family:Fredoka,sans-serif;font-size:20px;color:var(--pink);margin-bottom:2px}.hero h1{font-family:Fredoka,"Noto Sans TC",sans-serif;font-size:clamp(32px,5vw,58px);line-height:1;margin:0 0 8px;color:#f05f82}.hero p{margin:0;font-size:18px;font-weight:700}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(380px,1.08fr);gap:22px}.card{background:#fff;border-radius:30px;padding:28px;box-shadow:0 14px 30px rgba(190,80,110,.14)}
.stage{background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;text-align:center;min-height:440px;display:flex;flex-direction:column;justify-content:center;align-items:center}.stage h2{margin:0 0 4px;font-size:24px}.number{font-family:Fredoka,sans-serif;font-size:clamp(130px,18vw,190px);font-weight:700;line-height:1;text-shadow:7px 7px 0 rgba(190,50,90,.32);margin:8px 0 22px}.pop{animation:pop .48s ease}@keyframes pop{0%{transform:scale(.55) rotate(-6deg);opacity:.2}65%{transform:scale(1.08) rotate(2deg)}100%{transform:scale(1) rotate(0);opacity:1}}
.draw{background:var(--yellow);color:var(--orange);font-size:22px;font-weight:900;border-radius:18px;padding:16px 26px;box-shadow:0 7px 0 var(--orange2);transition:.12s}.draw:active{transform:translateY(5px);box-shadow:0 2px 0 var(--orange2)}.draw:disabled{opacity:.55;cursor:not-allowed}.progress{margin-top:22px;background:rgba(255,255,255,.2);padding:12px 20px;border-radius:999px;font-weight:900}
.board h2{margin:0;font-size:25px}.sub{margin:4px 0 18px;color:#ad7180}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.cell{aspect-ratio:1;border:2px solid var(--line);border-radius:15px;background:#fff;color:#e46b8b;font-family:Fredoka,sans-serif;font-size:clamp(20px,3vw,30px);font-weight:700;display:flex;align-items:center;justify-content:center;transition:.18s}.cell.drawn{background:#ff9ab3;color:#fff;border-color:#ff9ab3}.cell.current{background:var(--yellow);color:var(--orange);border-color:var(--orange2);transform:scale(1.08);box-shadow:0 5px 0 var(--orange2)}
.status{margin-top:18px;padding:14px;border-radius:16px;background:#fff7fa;text-align:center;font-weight:700}.reset{display:block;margin:18px auto 0;background:#fff;border:2px solid #ffc2d0;color:#d65a7a;border-radius:14px;padding:10px 18px;font-weight:900}
.winner{position:fixed;inset:0;background:rgba(90,20,45,.5);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.winner.show{display:flex}.modal{width:min(520px,94vw);background:#fff;border-radius:30px;padding:34px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25)}.modal .emoji{font-size:62px}.modal h2{margin:8px 0;color:var(--pink);font-size:32px}.modal p{font-size:18px;line-height:1.7}.close{background:var(--pink);color:#fff;border-radius:14px;padding:12px 26px;font-weight:900}
@media(max-width:820px){.wrap{padding-top:14px}.hero{flex-direction:column;text-align:center;padding:18px}.photo{width:min(300px,85vw);height:180px;flex-basis:auto}.layout{grid-template-columns:1fr}.stage{min-height:390px}.board{padding:22px}.grid{gap:7px}.cell{border-radius:11px}}
@media(max-width:430px){.hero p{font-size:15px}.stage{min-height:350px;padding:22px 14px}.number{font-size:120px}.draw{font-size:18px;padding:14px 20px}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero"><div class="photo"><small>婚禮照片位置<br><b>可替換 photo.jpg</b></small></div><div><div class="eyebrow">Let's Play Bingo! 🎉</div><h1>Su & Lin's Wedding</h1><p>準備好你們的 Bingo 卡，最快完成 2 條連線的前 6 名有驚喜大獎！</p></div></header>
<main class="layout">
<section class="card stage"><h2>目前抽出的號碼</h2><div id="number" class="number">—</div><button id="draw" class="draw">🎉 抽下一個號碼！</button><div id="progress" class="progress">已抽出 0 / 25 個號碼</div></section>
<section class="card board"><h2>號碼總表 🔢</h2><div class="sub">抽出的號碼會變成粉紅色，目前號碼會特別標示。</div><div id="grid" class="grid"></div><div id="status" class="status">準備好了嗎？一起開始 Bingo！</div><button id="reset" class="reset">↻ 重新開始本輪</button></section>
</main></div>
<div id="winner" class="winner"><div class="modal"><div class="emoji">🎊🏆🎉</div><h2 id="winnerTitle">Bingo!</h2><p id="winnerText"></p><button id="close" class="close">繼續遊戲</button></div></div>
<script>
const TOTAL=25;
const PRESET_SEQUENCE=[16,8,18,21,11,24,2,22,13,4,1,9,12,14,20,25,23,17,7,10,5,15,19,3,6];
let drawn=[];
const numberEl=document.getElementById("number"),progressEl=document.getElementById("progress"),gridEl=document.getElementById("grid"),drawBtn=document.getElementById("draw"),statusEl=document.getElementById("status"),winner=document.getElementById("winner"),winnerTitle=document.getElementById("winnerTitle"),winnerText=document.getElementById("winnerText");
function buildGrid(){gridEl.innerHTML="";for(let n=1;n<=TOTAL;n++){const c=document.createElement("div");c.className="cell";c.id="cell-"+n;c.textContent=n;gridEl.appendChild(c)}updateGrid()}
function updateGrid(){document.querySelectorAll(".cell").forEach(c=>c.classList.remove("drawn","current"));drawn.forEach(n=>document.getElementById("cell-"+n)?.classList.add("drawn"));if(drawn.length)document.getElementById("cell-"+drawn[drawn.length-1])?.classList.add("current");progressEl.textContent="已抽出 "+drawn.length+" / "+TOTAL+" 個號碼"}
function showNumber(n){numberEl.classList.remove("pop");void numberEl.offsetWidth;numberEl.textContent=n;numberEl.classList.add("pop")}
function checkBingoLines(){const s=new Set(drawn),lines=[];for(let r=0;r<5;r++)lines.push([0,1,2,3,4].map(c=>r*5+c+1));for(let c=0;c<5;c++)lines.push([0,1,2,3,4].map(r=>r*5+c+1));lines.push([1,7,13,19,25],[5,9,13,17,21]);return lines.filter(line=>line.every(n=>s.has(n))).length}
function drawNext(){if(drawn.length>=TOTAL)return;const n=PRESET_SEQUENCE[drawn.length];drawn.push(n);showNumber(n);updateGrid();const lines=checkBingoLines();statusEl.textContent=lines?"🎊 已完成 "+lines+" 條 Bingo 連線！":drawn.length===TOTAL?"所有號碼都抽完囉！":"繼續找出你的 Bingo 連線！";if(lines>=2){winnerTitle.textContent="Bingo！🎊";winnerText.textContent="太厲害了！你目前已完成 "+lines+" 條連線。若你是前 6 名，記得來找新人領取驚喜大獎！";winner.classList.add("show")}if(drawn.length===TOTAL){drawBtn.disabled=true;drawBtn.textContent="🎉 全部抽完囉！"}}
function resetGame(){if(!confirm("確定要重新開始這一輪嗎？已抽出的號碼會全部清空。"))return;drawn=[];numberEl.textContent="—";numberEl.classList.remove("pop");drawBtn.disabled=false;drawBtn.textContent="🎉 抽下一個號碼！";statusEl.textContent="準備好了嗎？一起開始 Bingo！";updateGrid();winner.classList.remove("show")}
drawBtn.addEventListener("click",drawNext);document.getElementById("reset").addEventListener("click",resetGame);document.getElementById("close").addEventListener("click",()=>winner.classList.remove("show"));winner.addEventListener("click",e=>{if(e.target===winner)winner.classList.remove("show")});buildGrid();
</script>
</body></html>
