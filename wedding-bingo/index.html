<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>歡樂婚禮 Bingo</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: #FFF0F5;
      background-image: radial-gradient(#FFD1DC 2px, transparent 2px);
      background-size: 30px 30px;
      color: #4A4A4A;
    }
    .title-font { font-family: 'Fredoka', sans-serif; }
    
    /* 照片外框與微傾斜動畫 */
    .photo-container {
      border: 8px solid white;
      box-shadow: 0 10px 25px rgba(255, 105, 135, 0.2);
      transform: rotate(-3deg);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .photo-container:hover { transform: rotate(1deg) scale(1.02); }
    
    /* 抽號主舞台 */
    .stage-card {
      background: linear-gradient(135deg, #FF758C 0%, #FF7EB3 100%);
      box-shadow: 0 15px 35px rgba(255, 117, 140, 0.3);
    }
    
    .number-display {
      font-size: clamp(6rem, 25vw, 10rem);
      font-weight: 900;
      color: white;
      text-shadow: 4px 6px 0px rgba(216, 59, 87, 0.5);
      line-height: 1;
      transition: all 0.3s ease;
    }
    .number-display.pop {
      animation: bounce-pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    
    @keyframes bounce-pop {
      0% { transform: scale(0.5); opacity: 0; }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* 立體按鈕 */
    .btn-draw {
      background: #FFD166;
      color: #D35400;
      box-shadow: 0 6px 0px #F39C12;
      transition: all 0.1s;
    }
    .btn-draw:active {
      transform: translateY(6px);
      box-shadow: 0 0px 0px #F39C12;
    }

    /* 號碼總表小格 */
    .grid-cell {
      background: white;
      border: 2px solid #FFE4E1;
      color: #FF758C;
      font-weight: bold;
      border-radius: 0.75rem;
      transition: all 0.2s;
    }
    .grid-cell.drawn {
      background: #FF758C;
      color: white;
      border-color: #FF758C;
      transform: scale(0.95);
    }
    .grid-cell.current {
      background: #FFD166;
      color: #D35400;
      border-color: #F39C12;
      transform: scale(1.1);
      box-shadow: 0 4px 10px rgba(243, 156, 18, 0.4);
      z-index: 10;
    }
  </style>
</head>
<body class="min-h-screen py-8 px-4">
  <div class="max-w-5xl mx-auto space-y-8">
    
    <!-- 頂部：照片與婚禮標題 -->
    <header class="flex flex-col md:flex-row items-center gap-8 bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl">
      <div class="shrink-0">
        <!-- 讀取同資料夾下的照片 -->
        <img src="23160-0188.jpg" 
             alt="Couple" 
             class="photo-container w-48 h-48 object-cover rounded-2xl">
      </div>
      <div class="text-center md:text-left flex-1">
        <p class="text-sm font-bold text-[#FF758C] tracking-widest uppercase mb-2">Let's Play Bingo!</p>
        <h1 class="title-font text-4xl md:text-5xl text-gray-800 mb-3">衍誠 & 巧玲的婚禮</h1>
        <p class="text-gray-500 font-medium">準備好你們的 Bingo 卡，最快完成 2 條連線的前 8 名有驚喜大獎！</p>
      </div>
    </header>

    <main class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- 左側：抽號主控台 -->
      <section class="space-y-6">
        <div class="stage-card rounded-3xl p-10 text-center relative overflow-hidden">
          <p class="text-white/80 font-bold tracking-widest mb-4">目前抽出的號碼</p>
          <div id="current-number" class="number-display">—</div>
        </div>
        
        <button id="draw-btn" class="btn-draw w-full py-5 rounded-2xl text-2xl font-bold title-font flex items-center justify-center gap-2">
          🎉 抽下一個號碼！
        </button>
        
        <div class="bg-white p-5 rounded-2xl shadow-sm text-center">
          <p class="text-gray-500 font-medium mb-2">已抽出 <span id="count-drawn" class="text-[#FF758C] font-bold text-xl">0</span> / 25 個號碼</p>
          <div class="w-full bg-gray-100 rounded-full h-3">
            <div id="progress-bar" class="bg-[#FF758C] h-3 rounded-full transition-all duration-500" style="width: 0%"></div>
          </div>
        </div>
      </section>

      <!-- 右側：全區號碼表 -->
      <section class="bg-white p-6 rounded-3xl shadow-xl flex flex-col">
        <h2 class="title-font text-2xl text-gray-800 mb-4 text-center">號碼總表</h2>
        <div id="number-grid" class="grid grid-cols-5 gap-2 flex-1">
          <!-- 號碼由 JavaScript 自動生成 -->
        </div>
        <div class="mt-6 pt-4 border-t border-gray-100 flex justify-between items-center">
          <p class="text-sm text-gray-400">點擊重新開始可清空號碼</p>
          <button id="reset-btn" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-600 rounded-lg text-sm font-bold transition">
            重新開始本輪
          </button>
        </div>
      </section>
    </main>

  </div>

  <script>
    const TOTAL = 25;
    let drawn = [];
    let current = null;

    const display = document.getElementById('current-number');
    const drawBtn = document.getElementById('draw-btn');
    const resetBtn = document.getElementById('reset-btn');
    const grid = document.getElementById('number-grid');
    const countText = document.getElementById('count-drawn');
    const progress = document.getElementById('progress-bar');

    // 生成 1-25 的網格
    for(let i = 1; i <= TOTAL; i++) {
      const cell = document.createElement('div');
      cell.className = 'grid-cell flex items-center justify-center text-xl h-14';
      cell.textContent = i;
      cell.id = 'cell-' + i;
      grid.appendChild(cell);
    }

    function updateUI() {
      // 更新大號碼顯示
      display.textContent = current || '—';
      if(current) {
        display.classList.remove('pop');
        void display.offsetWidth; // 觸發重繪以重啟動畫
        display.classList.add('pop');
      }

      // 更新總表狀態
      for(let i = 1; i <= TOTAL; i++) {
        const cell = document.getElementById('cell-' + i);
        cell.classList.toggle('drawn', drawn.includes(i));
        cell.classList.toggle('current', i === current);
      }

      // 更新進度條
      countText.textContent = drawn.length;
      progress.style.width = (drawn.length / TOTAL * 100) + '%';
      
      // 更新按鈕狀態
      if(drawn.length >= TOTAL) {
        drawBtn.textContent = '全數抽完啦！';
        drawBtn.style.opacity = '0.5';
        drawBtn.style.pointerEvents = 'none';
      } else {
        drawBtn.textContent = '🎉 抽下一個號碼！';
        drawBtn.style.opacity = '1';
        drawBtn.style.pointerEvents = 'auto';
      }
    }

    // ✅ 更新為「漸進式產生 8 位得獎者」的完美劇本
    const PRESET_SEQUENCE = [16, 8, 18, 21, 11, 24, 2, 22, 13, 4, 1, 9, 12, 14, 20, 25, 23, 17, 7, 10, 5, 15, 19, 3, 6];

    // 抽號邏輯
    drawBtn.addEventListener('click', () => {
      if(drawn.length >= TOTAL) return;
      
      // 依序從預設陣列中拿取下一個號碼
      const next = PRESET_SEQUENCE[drawn.length];
      
      drawn.push(next);
      current = next;
      updateUI();
    });

    // 重新開始
    resetBtn.addEventListener('click', () => {
      if(confirm('確定要清空所有號碼重新開始嗎？')) {
        drawn = [];
        current = null;
        updateUI();
      }
    });

    updateUI();
  </script>
</body>
</html>
